# Render — deploy do Glassy PM (API + front) + Postgres
# No Render: New -> Blueprint -> conecte seu repositório privado do GitHub.
# O Render cria o banco, injeta DATABASE_URL e gera JWT_SECRET sozinho.
services:
  - type: web
    name: glassy-pm
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glassy-pm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: glassy-pm
          property: host
databases:
  - name: glassy-pm-db
    plan: free
    # Atenção: no plano free do Render o Postgres expira em 30 dias.
    # Para uso contínuo, troque para o plano pago (a partir de ~US$ 6/mês).
